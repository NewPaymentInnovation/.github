service: settle-processing

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  environment:
    NODE_ENV: ${self:provider.stage}
    SETTLE_PROCESSING_DATABASE_URL: ${ssm:/settle-processing/${self:provider.stage}/database-url}
    AWS_REGION: ${self:provider.region}
    S3_BUCKET_NAME: ${ssm:/settle-processing/${self:provider.stage}/s3-bucket-name}
    SQS_INGEST_QUEUE_URL: ${ssm:/settle-processing/${self:provider.stage}/sqs-ingest-queue-url}
    SQS_CALC_QUEUE_URL: ${ssm:/settle-processing/${self:provider.stage}/sqs-calc-queue-url}
    SQS_DLQ_URL: ${ssm:/settle-processing/${self:provider.stage}/sqs-dlq-url}
    POSTHOG_API_KEY: ${ssm:/settle-processing/${self:provider.stage}/posthog-api-key}
    POSTHOG_HOST: ${ssm:/settle-processing/${self:provider.stage}/posthog-host, 'https://app.posthog.com'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
        - s3:HeadObject
      Resource:
        - arn:aws:s3:::${ssm:/settle-processing/${self:provider.stage}/s3-bucket-name}/*
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - arn:aws:sqs:${self:provider.region}:*:settle-ingest-${self:provider.stage}
        - arn:aws:sqs:${self:provider.region}:*:settle-calc-${self:provider.stage}
        - arn:aws:sqs:${self:provider.region}:*:settle-dlq-${self:provider.stage}
    - Effect: Allow
      Action:
        - ssm:GetParameter
        - ssm:GetParameters
      Resource:
        - arn:aws:ssm:${self:provider.region}:*:parameter/settle-processing/${self:provider.stage}/*

functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
